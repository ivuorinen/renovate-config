# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: pretty-format-json
        args: [--autofix, --no-ensure-ascii]
      - id: trailing-whitespace

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.32.2
    hooks:
      # --no-global is required: renovate-config-validator treats any explicitly
      # passed filename as a *global* self-hosted config, whose schema is a
      # superset that silently accepts globalOnly options. Without it, a
      # globalOnly option in the preset validates clean and is then ignored by
      # every consumer. Hook output must read "as repo config".
      - id: renovate-config-validator
        files: default.json
        args: [--strict, --no-global]
      - id: renovate-config-validator
        name: renovate-config-validator (repo config)
        files: .github/renovate.json
        args: [--strict, --no-global]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-jsonschema
        name: check-renovate-preset
        files: default.json
        args:
          - --schemafile
          - https://docs.renovatebot.com/renovate-schema.json

  - repo: local
    hooks:
      - id: check-managers
        name: check-custom-managers
        entry: node test/check-managers.mjs
        language: system
        files: ^(default\.json|test/)
        pass_filenames: false

      # renovate-config-validator types commitMessagePrefix as a plain string, so
      # a malformed prefix — or a "!" breaking marker back on github-actions —
      # validates clean and only fails in consuming repos.
      - id: check-commit-messages
        name: check-commit-messages
        entry: node test/check-commit-messages.mjs
        language: system
        files: ^(default\.json|test/)
        pass_filenames: false
